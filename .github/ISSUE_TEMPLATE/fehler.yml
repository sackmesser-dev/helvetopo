name: Fehler melden
description: Darstellungsfehler, falsches Routing, Absturz, Build-Problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Bitte kurz und sachlich schreiben, ein Gedanke je Satz ([Schreibregeln](../blob/main/docs/schreibregeln.md)).
  - type: textarea
    id: beschreibung
    attributes:
      label: Was ist falsch?
      description: Was siehst du, und was hättest du erwartet?
    validations:
      required: true
  - type: input
    id: ort
    attributes:
      label: Ort
      description: Koordinaten (WGS84 oder LV95) oder Link auf map.geo.admin.ch
  - type: input
    id: karte
    attributes:
      label: Karte und Version
      placeholder: Helvetopo_Vektor_Schweiz_2026-11.img
  - type: input
    id: geraet
    attributes:
      label: Gerät oder Programm
      placeholder: GPSMAP 67, Firmware 21.30 / BaseCamp 4.8.13 unter Windows 11
  - type: textarea
    id: anhang
    attributes:
      label: Screenshots, Logs, Zoomstufe
      description: Gern mit Vergleichsausschnitt der Landeskarte.

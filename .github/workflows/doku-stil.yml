# Prüft geänderte Markdown-Dateien und die PR-Beschreibung nach docs/schreibregeln.md (ASD-STE100).
name: Doku-Stil

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
    paths: ["**.md", "src/doc_lint/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Geänderte Markdown-Dateien prüfen
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          files=$(git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD -- '*.md' || true)
          if [ -z "$files" ]; then echo "Keine geänderten Markdown-Dateien."; exit 0; fi
          python3 src/doc_lint/check_md.py --github $files

      - name: PR-Beschreibung prüfen
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" | python3 src/doc_lint/check_md.py --github --stdin --name PR-Beschreibung
